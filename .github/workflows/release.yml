name: Stable release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source commit
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.source_ref }}

      - name: Record exact commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release assets
    needs: source
    uses: ./.github/workflows/build-release-assets.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
    secrets: inherit

  publish:
    name: Publish immutable stable release
    if: github.event_name == 'push'
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0

      - name: Download completed release assets
        uses: actions/download-artifact@v6
        with:
          pattern: mlir-lsp-*
          path: dist
          merge-multiple: true

      - name: Verify assets and source metadata
        shell: bash
        run: |
          (cd dist && sha256sum -c *.sha256)
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "${verify_dir}"' EXIT
          for platform in linux-x86_64 macos-arm64; do
            tar -xzf "dist/mlir-lsp-${platform}.tar.gz" -C "${verify_dir}"
            test "$(< "${verify_dir}/mlir-lsp-${platform}/SOURCE_COMMIT")" = "${SOURCE_COMMIT}"
          done

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mlir-lsp-linux-x86_64.tar.gz \
            dist/mlir-lsp-linux-x86_64.tar.gz.sha256 \
            dist/mlir-lsp-macos-arm64.tar.gz \
            dist/mlir-lsp-macos-arm64.tar.gz.sha256 \
            --verify-tag \
            --generate-notes \
            --notes "Source commit: ${SOURCE_COMMIT}" \
            --title "${GITHUB_REF_NAME}" \
            --latest
