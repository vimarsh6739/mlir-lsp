name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # This build's Bazel output base is large enough to exhaust the 14 GB
      # available on a standard runner. Remove preinstalled tools that the
      # release build does not use before fetching and compiling dependencies.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/powershell \
            /usr/share/dotnet
          docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Build mlir-lsp-server
        run: bazelisk build //:mlir-lsp-server

      - name: Package release
        shell: bash
        run: |
          artifact="mlir-lsp-${GITHUB_REF_NAME}-linux-x86_64"

          mkdir -p "dist/${artifact}"
          install -m 0755 \
            bazel-bin/mlir-lsp-server \
            "dist/${artifact}/mlir-lsp-server"
          cp README.md LICENSE "dist/${artifact}/"

          tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
          cd dist
          sha256sum "${artifact}.tar.gz" \
            > "${artifact}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
