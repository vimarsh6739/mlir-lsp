name: Release

on:
  schedule:
    - cron: "0 6 * * 0"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source and version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      should_build: ${{ steps.source.outputs.should_build }}
      tag: ${{ steps.source.outputs.tag }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Resolve source and version
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          tag=""
          should_build=true

          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            latest="$(git tag --list 'v0.1.*' --sort=-version:refname | awk '/^v0\.1\.[0-9]+$/{print; exit}')"
            if [[ -n "${latest}" && "$(git rev-list -n 1 "${latest}")" == "${commit}" ]]; then
              tag="${latest}"
              should_build=false
            elif [[ "${latest}" =~ ^v0\.1\.([0-9]+)$ ]]; then
              tag="v0.1.$((BASH_REMATCH[1] + 1))"
            else
              tag="v0.1.0"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            tag="${GITHUB_REF_NAME}"
          fi

          {
            echo "commit=${commit}"
            echo "should_build=${should_build}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux x86-64 (Modal)
    if: needs.source.outputs.should_build == 'true'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 370
    env:
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Modal client
        run: python -m pip install "modal>=1.3,<2"

      - name: Build, test, inspect, and package on Modal
        run: |
          modal run .github/modal/build_linux.py \
            --source-commit "${{ needs.source.outputs.commit }}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux" \
            --output-dir dist

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v6
        with:
          name: mlir-lsp-linux-x86_64
          path: |
            dist/mlir-lsp-linux-x86_64.tar.gz
            dist/mlir-lsp-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Apple Silicon
    if: needs.source.outputs.should_build == 'true'
    needs: source
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Build and test
        run: |
          bazelisk build //:mlir-lsp
          bazel-bin/mlir-lsp --help

      - name: Inspect runtime dependencies
        run: otool -L bazel-bin/mlir-lsp

      - name: Package and smoke-test
        shell: bash
        run: |
          ./scripts/package-release.sh \
            macos-arm64 \
            bazel-bin/mlir-lsp \
            "${{ needs.source.outputs.commit }}" \
            dist

          (cd dist && shasum -a 256 -c mlir-lsp-macos-arm64.tar.gz.sha256)
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "${smoke_dir}"' EXIT
          tar -xzf dist/mlir-lsp-macos-arm64.tar.gz -C "${smoke_dir}"
          "${smoke_dir}/mlir-lsp-macos-arm64/mlir-lsp" --help

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v6
        with:
          name: mlir-lsp-macos-arm64
          path: |
            dist/mlir-lsp-macos-arm64.tar.gz
            dist/mlir-lsp-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: github.event_name != 'workflow_dispatch' && needs.source.outputs.should_build == 'true'
    needs: [source, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}

    steps:
      - name: Download completed release assets
        uses: actions/download-artifact@v6
        with:
          pattern: mlir-lsp-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(
            --generate-notes
            --latest
            --notes "Source commit: ${SOURCE_COMMIT}"
            --title "${RELEASE_TAG}"
          )
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "${SOURCE_COMMIT}")
          fi
          gh release create "${RELEASE_TAG}" dist/* "${args[@]}"
