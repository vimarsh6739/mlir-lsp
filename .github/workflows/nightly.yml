name: Weekly nightly release

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (artifacts only; never publishes)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-nightly
  cancel-in-progress: false

jobs:
  source:
    name: Resolve source commit
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      should_build: ${{ steps.source.outputs.should_build }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          nightly="$(git ls-remote --tags origin refs/tags/nightly | cut -f1)"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == schedule && "${commit}" == "${nightly}" ]]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build release assets
    if: needs.source.outputs.should_build == 'true'
    needs: source
    uses: ./.github/workflows/build-release-assets.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
    secrets: inherit

  publish:
    name: Replace nightly prerelease
    if: github.event_name == 'schedule' && needs.source.outputs.should_build == 'true'
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}

    steps:
      - name: Download completed release assets
        uses: actions/download-artifact@v6
        with:
          pattern: mlir-lsp-*
          path: dist
          merge-multiple: true

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          printf 'Weekly rolling build from main.\n\nSource commit: %s\n' "${SOURCE_COMMIT}" \
            > nightly-notes.md
          gh release create nightly \
            dist/* \
            --target "${SOURCE_COMMIT}" \
            --title "Nightly" \
            --notes-file nightly-notes.md \
            --prerelease \
            --latest=false
