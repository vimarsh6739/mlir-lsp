name: Build release assets

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or ref to build
        required: true
        type: string
    secrets:
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to build (artifacts only)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 (Modal)
    runs-on: ubuntu-24.04
    timeout-minutes: 370
    env:
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Modal client
        run: python -m pip install "modal>=1.3,<2"

      - name: Build, test, inspect, and package on Modal
        run: |
          modal run .github/modal/build_linux.py \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux" \
            --output-dir dist

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v6
        with:
          name: mlir-lsp-linux-x86_64
          path: |
            dist/mlir-lsp-linux-x86_64.tar.gz
            dist/mlir-lsp-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Require Apple Silicon and record source commit
        id: source
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Restore Bazel caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/mlir-lsp/bazel-disk
            ~/.cache/mlir-lsp/repository
          key: macos-arm64-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'WORKSPACE', 'workspace.bzl') }}
          restore-keys: macos-arm64-bazel-

      - name: Build and test
        shell: bash
        run: |
          mkdir -p \
            "${HOME}/.cache/mlir-lsp/bazel-disk" \
            "${HOME}/.cache/mlir-lsp/repository"
          cache_flags=(
            "--disk_cache=${HOME}/.cache/mlir-lsp/bazel-disk"
            "--repository_cache=${HOME}/.cache/mlir-lsp/repository"
          )
          bazelisk build "${cache_flags[@]}" //:mlir-lsp
          bazel-bin/mlir-lsp --help

      - name: Inspect runtime dependencies
        run: otool -L bazel-bin/mlir-lsp

      - name: Package and smoke-test
        shell: bash
        run: |
          ./scripts/package-release.sh \
            macos-arm64 \
            bazel-bin/mlir-lsp \
            "${{ steps.source.outputs.commit }}" \
            dist

          (cd dist && shasum -a 256 -c mlir-lsp-macos-arm64.tar.gz.sha256)
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "${smoke_dir}"' EXIT
          tar -xzf dist/mlir-lsp-macos-arm64.tar.gz -C "${smoke_dir}"
          "${smoke_dir}/mlir-lsp-macos-arm64/mlir-lsp" --help

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v6
        with:
          name: mlir-lsp-macos-arm64
          path: |
            dist/mlir-lsp-macos-arm64.tar.gz
            dist/mlir-lsp-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
